onboarding = false
[keys]
navigate_workspace_down = "j"
navigate_workspace_up = "k"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch/create"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: create from current branch"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[ui.toast]
delivery = "herdr"

[theme]
name = "catppuccin"
auto_switch = false
